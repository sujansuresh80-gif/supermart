{% extends 'base.html' %}

{% block title %}
SuperMart - {{ title }}
{% endblock %}

{% block content %}

<h1>SuperMart</h1>

<h2>{{ title }}</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Product
    </button>

</form>

<br>

<a href="{% url 'product_list' %}">
    Back to Products
</a>

{% endblock %}
